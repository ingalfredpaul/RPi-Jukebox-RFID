# Replacement for /etc/nginx/sites-available/default (backup first, see INSTALL.md).
# Serves the new app from src/webapp-next/build and keeps everything the old app needed:
#  - /cover-cache/ still points to the old build dir, because jukebox.yaml writes covers there
#  - /logs as before
# Upload service: included from the snippet that lives in ~/phoniebox-upload/.
# Replace "admin" if your user is named differently.
server {
	listen 80 default_server;
	listen [::]:80 default_server;

	root /home/admin/RPi-Jukebox-RFID/src/webapp-next/build;
	index index.html;
	server_name _;

	location / {
		try_files $uri $uri/ /index.html;
	}

	# index.html and the manifest must never be cached, hashed assets may be
	location = /index.html { add_header Cache-Control "no-cache"; }
	location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; }

	location /cover-cache/ {
		alias /home/admin/RPi-Jukebox-RFID/src/webapp/build/cover-cache/;
	}

	location /logs {
		root /home/admin/RPi-Jukebox-RFID/shared;
		autoindex on;
		autoindex_exact_size off;
		autoindex_localtime on;
		default_type text/plain;
	}

	include /home/admin/phoniebox-upload/nginx-upload.conf;
}
