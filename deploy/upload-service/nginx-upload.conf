# nginx snippet: include INSIDE the existing `server { ... }` block (port 80),
# e.g.  include /home/admin/phoniebox-upload/nginx-upload.conf;
# Upload service listens on 127.0.0.1:8081 (see upload-service.conf).

location = /upload {
    proxy_pass http://127.0.0.1:8081;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    client_max_body_size 1100m;
    # stream straight to the service, never buffer big files on the SD card / RAM
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_connect_timeout 5s;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    client_body_timeout 3600s;
}

location /files/ {
    proxy_pass http://127.0.0.1:8081;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    client_max_body_size 1m;
    proxy_buffering off;
    proxy_read_timeout 60s;
}
